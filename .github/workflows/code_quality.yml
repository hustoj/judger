name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request.head.sha is unset on push; fall back to the pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          # Community linter. Do not pass QODANA_TOKEN: the stored secret is
          # rejected by Qodana Cloud, and an invalid token fails the scan
          # before analysis starts.
          args: --linter,qodana-python-community
