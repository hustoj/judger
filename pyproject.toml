[project]
name = "judger"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
authors = [{ name = "He Jun", email = "freefcw@gmail.com" }]
dependencies = [
    "toml>=0.10.2,<0.11",
    # SDK 7.1+ supports the Unix socket adapter with Requests 2.32+ / urllib3 2.
    "docker>=7.1.0,<8",
    "pika>=1.3.0,<2",
    "psutil>=5.9.1,<6",
    "boto3>=1.24.46,<2",
    "requests>=2.32.0,<3",
    "flask>=3.1.0,<4",
]

[dependency-groups]
dev = ["pylint==3.3.9"]

[tool.uv]
package = false
# The daemon needs Linux cgroups. macOS is for local checks.
# Windows is not a supported daemon or local-check platform.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
