[project]
name = "judger"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
authors = [{ name = "He Jun", email = "freefcw@gmail.com" }]
dependencies = [
    "toml>=0.10.2,<0.11",
    # SDK 7.1+ supports the Unix socket adapter with Requests 2.32+ / urllib3 2.
    "docker>=7.1.0,<8",
    "pika>=1.3.0,<2",
    "psutil>=5.9.1,<6",
    "boto3>=1.24.46,<2",
    "requests>=2.32.0,<3",
    "flask>=3.1.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "G", "I", "UP", "B", "BLE", "RET", "A", "C4", "PIE", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
# The daemon needs Linux cgroups. macOS is for local checks.
# Windows is not a supported daemon or local-check platform.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
